#管理kafka地址
bootstrap.servers=192.168.40.119:9092,192.168.40.122:9092,192.168.40.123:9092

#从kafka哪里开始读：earliest/latest
auto.offset.reset=latest
#auto.offset.reset=earliest

#kafka broker下的topic名称
kafka.topic=SESSION-RECORD-LOG

#kafka消费group id
group.id=connections-test-g

#storm topology workers
topology.workers=3

#一般与kafka 分区数量1:1关系
topology.spout.parallelism=9

#计算bolt并行度
topology.bolt.time.calculate=12

#最大容忍区间
max.number=30

#输出Kafka地址
results.output.servers=192.168.40.119:9092,192.168.40.122:9092,192.168.40.123:9092

#输出Topic
results.output.topics=TRAFFIC-METRICS-LOG

#tick时钟频率
topology.tick.tuple.freq.secs=30

#最大的spout发送数量
topology.config.max.spout.pending=150000

#程序ack
topology.num.acks=1

#允许发送kafka最大失败数
max.failure.num=20

